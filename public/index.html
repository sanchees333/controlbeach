async function renderDespesas(){
  const [despesas, evs] = await Promise.all([api('GET','/despesas'), api('GET','/eventos')]);
  const total = despesas.reduce((a,d) => a+d.valor, 0);
  const mes = mesStr();
  const desMes = despesas.filter(d => d.data && d.data.startsWith(mes));
  const totMes = desMes.reduce((a,d) => a+d.valor, 0);
  const fixas = despesas.filter(d => d.tipo==='fixa').reduce((a,d) => a+d.valor, 0);
  const vars = despesas.filter(d => d.tipo==='variavel').reduce((a,d) => a+d.valor, 0);
  const catC = {Aluguel:'#d63031',Salários:'#e17055',Água:'#2563eb',Energia:'#f5a800',Suprimentos:'#1a9e5c',Manutenção:'#7c3aed',Marketing:'#0891b2',Outros:'#999'};

  document.getElementById('page').innerHTML = `
    <div class="ph"><h1>Despesas</h1><button class="btn btn-p" onclick="openDespModal()">+ Adicionar</button></div>
    <div class="cg4">
      <div class="card r"><div class="ct">Total Histórico</div><div class="cv">${fmt(total)}</div></div>
      <div class="card r"><div class="ct">Este Mês</div><div class="cv">${fmt(totMes)}</div></div>
      <div class="card y"><div class="ct">Fixas</div><div class="cv">${fmt(fixas)}</div></div>
      <div class="card b"><div class="ct">Variáveis</div><div class="cv">${fmt(vars)}</div></div>
    </div>
    <div class="card">
      <div class="cht">Todas as Despesas</div>
      ${!despesas.length ? '<div class="es"><div class="ic">💸</div><p>Nenhuma despesa</p></div>' : ''}
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Evento</th><th>Valor</th><th></th></tr></thead>
        <tbody>${despesas.map(d => `
          <tr>
            <td>${fmtDate(d.data)}</td>
            <td class="fb">${d.descricao}</td>
            <td><span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:${catC[d.categoria]||'#999'};flex-shrink:0"></span>${d.categoria}</span></td>
            <td><span class="badge ${d.tipo==='fixa'?'by':'bb'}">${d.tipo==='fixa'?'Fixa':'Variável'}</span></td>
            <td>${d.evento_nome?`<span class="badge bt xs">${d.evento_nome}</span>`:'—'}</td>
            <td class="tr f8">${fmt(d.valor)}</td>
            <td><button class="btn btn-d sm" onclick="(async()=>{if(!confirm('Remover?'))return;await api('DELETE','/despesas/${d.id}');toast('Removida','i');renderDespesas();})()">×</button></td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;

  function openDespModal(){
    openModal('Adicionar Despesa', `
      <div class="ig"><label class="lbl">Descrição</label><input class="inp" id="dp-d" placeholder="Ex: Conta de Luz Abril"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="ig"><label class="lbl">Categoria</label><select class="inp" id="dp-c">${Object.keys(catC).map(c => `<option>${c}</option>`).join('')}</select></div>
        <div class="ig"><label class="lbl">Tipo</label><select class="inp" id="dp-t"><option value="fixa">Fixa</option><option value="variavel">Variável</option></select></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="ig"><label class="lbl">Valor (R$)</label><input class="inp" type="number" id="dp-v" value="0" step="10"></div>
        <div class="ig"><label class="lbl">Data</label><input class="inp" type="date" id="dp-dt" value="${todayStr()}"></div>
      </div>
      <div class="ig"><label class="lbl">Vincular Evento</label><select class="inp" id="dp-ev"><option value="">— Nenhum —</option>${evs.map(e => `<option value="${e.id}">${e.nome}</option>`).join('')}</select></div>`, `
      <button class="btn btn-g" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-d" onclick="(async()=>{
        const d=document.getElementById('dp-d').value.trim();
        if(!d){toast('Preencha a descrição','e');return;}
        await api('POST','/despesas',{
          descricao:d, categoria:document.getElementById('dp-c').value,
          tipo:document.getElementById('dp-t').value,

let dashModo = 'mes';
let dashMesRef = mesStr();
let dashAnoRef = new Date().getFullYear();

async function renderDashboard(){
  const d = await api('GET', '/dashboard');
  const pmls = {pix:'PIX', dinheiro:'Dinheiro', debito:'Débito', credito:'Crédito'};

  const mesesDisp = [];
  for(let i = 23; i >= 0; i--){
    const d2 = new Date(); d2.setDate(1); d2.setMonth(d2.getMonth()-i);
    mesesDisp.push(`${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,'0')}`);
  }

  const anoAtual = new Date().getFullYear();
  const anos = [anoAtual, anoAtual-1, anoAtual-2].filter(a => a >= 2024);

  document.getElementById('page').innerHTML = `
    <div class="ph"><h1>Dashboard Financeiro</h1></div>

    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:18px;box-shadow:var(--sh)">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px">Visualizar:</span>
        <button class="btn ${dashModo==='hoje'?'btn-p':'btn-g'} sm" onclick="dashModo='hoje';renderDashboard()">📅 Hoje</button>

        <div style="display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:3px">
          <button class="btn btn-g sm" style="padding:4px 8px" onclick="navMes(-1)">‹</button>
          <select class="inp" id="sel-mes" style="border:none;background:transparent;font-weight:700;padding:4px 6px;width:130px;font-size:13px"
            onchange="dashMesRef=this.value;dashModo='mes';renderDashboard()">
            ${mesesDisp.map(m => {
              const [y,mo] = m.split('-');
              const nome = new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
              return `<option value="${m}" ${m===dashMesRef?'selected':''}>${nome}</option>`;
            }).join('')}
          </select>
          <button class="btn btn-g sm" style="padding:4px 8px" onclick="navMes(1)">›</button>
        </div>

        <div style="display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:3px">
          <button class="btn btn-g sm" style="padding:4px 8px" onclick="navAno(-1)">‹</button>
          <select class="inp" id="sel-ano" style="border:none;background:transparent;font-weight:700;padding:4px 6px;width:80px;font-size:13px"
            onchange="dashAnoRef=+this.value;dashModo='ano';renderDashboard()">
            ${anos.map(a => `<option value="${a}" ${a===dashAnoRef?'selected':''}>${a}</option>`).join('')}
          </select>
          <button class="btn btn-g sm" style="padding:4px 8px" onclick="navAno(1)">›</button>
        </div>

        <div style="display:flex;align-items:center;gap:4px">
          <input class="inp" type="date" id="fil-i" style="width:130px;font-size:12px">
          <span class="xs mt">até</span>
          <input class="inp" type="date" id="fil-f" style="width:130px;font-size:12px" value="${todayStr()}">
          <button class="btn btn-g sm" onclick="dashModo='custom';renderDashboard()">Filtrar</button>
        </div>
      </div>
      <div id="periodo-label" style="margin-top:8px;font-size:12px;color:var(--text2)"></div>
    </div>

    <div id="dash-content"><div class="es"><div class="ic">📊</div><p>Carregando...</p></div></div>`;

  await carregarDashContent(d, pmls);
}

function navMes(delta){
  const [y,m] = dashMesRef.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  dashMesRef = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  dashModo = 'mes';
  renderDashboard();
}
function navAno(delta){
  dashAnoRef = Math.max(2024, dashAnoRef + delta);
  dashModo = 'ano';
  renderDashboard();
}

async function carregarDashContent(dashGlobal, pmls){
  const label = document.getElementById('periodo-label');
  const content = document.getElementById('dash-content');
  if(!content) return;

  let dados, titulo;
  const hoje = todayStr();

  if(dashModo === 'hoje'){
    dados = await api('GET', `/dashboard/periodo?inicio=${hoje}&fim=${hoje}&detalhe=1`);
    titulo = `📅 Hoje — ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}`;
    if(label) label.innerHTML = `<span style="color:var(--blue);font-weight:700">Mostrando: ${titulo}</span>`;
    renderDashMes(dados, content, titulo, pmls, false);

  } else if(dashModo === 'mes'){
    const [y,m] = dashMesRef.split('-');
    const lastDay = new Date(+y, +m, 0).getDate();
    dados = await api('GET', `/dashboard/periodo?inicio=${dashMesRef}-01&fim=${dashMesRef}-${lastDay}&detalhe=1`);
    const nomeMes = new Date(+y, +m-1, 1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    titulo = `📆 ${nomeMes.charAt(0).toUpperCase()+nomeMes.slice(1)}`;
    const isAtual = dashMesRef === mesStr();
    if(label) label.innerHTML = `<span style="color:var(--blue);font-weight:700">Mostrando: ${titulo}</span>${isAtual?' <span class="badge bg" style="font-size:10px">Mês Atual</span>':''}`;
    renderDashMes(dados, content, titulo, pmls, true);

  } else if(dashModo === 'ano'){
    dados = await api('GET', `/dashboard/periodo?inicio=${dashAnoRef}-01-01&fim=${dashAnoRef}-12-31&detalhe=1&ano=${dashAnoRef}`);
    titulo = `📊 Ano ${dashAnoRef}`;
    const isAtual = dashAnoRef === new Date().getFullYear();
    if(label) label.innerHTML = `<span style="color:var(--blue);font-weight:700">Mostrando: ${titulo}</span>${isAtual?' <span class="badge bg" style="font-size:10px">Ano Atual</span>':''}`;
    renderDashAno(dados, content, titulo, pmls);

  } else if(dashModo === 'custom'){
    const i = document.getElementById('fil-i')?.value;
    const f = document.getElementById('fil-f')?.value;
    if(!i||!f){ toast('Selecione o período','e'); return; }
    dados = await api('GET', `/dashboard/periodo?inicio=${i}&fim=${f}&detalhe=1`);
    titulo = `🔎 ${fmtDate(i)} até ${fmtDate(f)}`;
    if(label) label.innerHTML = `<span style="color:var(--yellow2);font-weight:700">Mostrando: ${titulo}</span>`;
    renderDashMes(dados, content, titulo, pmls, true);
  }
}

async function renderCardapio(){
  const menu = await api('GET','/menu');
  document.getElementById('page').innerHTML = `
    <div class="ph"><h1>Cardápio</h1><button class="btn btn-p" onclick="openAddProd()">+ Novo Produto</button></div>
    <p class="xs mt mb16">Gerencie produtos e preços. Alterações refletem imediatamente nas comandas.</p>
    ${menu.map(cat => `
      <div class="card mb12">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div class="fb" style="font-size:15px">${cat.icone} ${cat.nome}</div>
          <button class="btn btn-g sm" onclick="openAddProd('${cat.id}')">+ Produto</button>
        </div>
        <table><thead><tr><th>Produto</th><th>Preço</th><th></th></tr></thead><tbody>
          ${cat.products.map(p => `
            <tr>
              <td class="fb">${p.nome}</td>
              <td class="tg f8">${fmt(p.preco)}</td>
              <td><div style="display:flex;gap:4px">
                <button class="btn btn-g sm" onclick="openEditProd('${p.id}','${p.nome.replace(/'/g,"\\'")}',${p.preco})">✏️</button>
                <button class="btn btn-d sm" onclick="(async()=>{if(!confirm('Remover?'))return;await api('DELETE','/menu/produtos/${p.id}');toast('Removido','i');renderCardapio();})()">×</button>
              </div></td>
            </tr>`).join('')}
        </tbody></table>
      </div>`).join('')}`;

  async function openAddProd(catId){
    const m = await api('GET','/menu');
    openModal('Adicionar Produto', `
      <div class="ig"><label class="lbl">Categoria</label><select class="inp" id="np-c">${m.map(c => `<option value="${c.id}" ${c.id===catId?'selected':''}>${c.icone} ${c.nome}</option>`).join('')}</select></div>
      <div class="ig"><label class="lbl">Nome</label><input class="inp" id="np-n" placeholder="Nome do produto"></div>
      <div class="ig"><label class="lbl">Preço (R$)</label><input class="inp" type="number" id="np-p" value="10" step="0.5"></div>`, `
      <button class="btn btn-g" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-p" onclick="(async()=>{
        const n=document.getElementById('np-n').value.trim();
        if(!n){toast('Nome obrigatório','e');return;}
        await api('POST','/menu/produtos',{
          categoria_id:document.getElementById('np-c').value,
          nome:n, preco:+document.getElementById('np-p').value
        });
        closeModal();toast('Adicionado!','s');renderCardapio();
      })()">Adicionar</button>`);
  }
  window.openAddProd = openAddProd;

  window.openEditProd = function(id, nome, preco){
    openModal('Editar Produto', `
      <div class="ig"><label class="lbl">Nome</label><input class="inp" id="ep-n" value="${nome}"></div>
      <div class="ig"><label class="lbl">Preço (R$)</label><input class="inp" type="number" id="ep-p" value="${preco}" step="0.5"></div>`, `
      <button class="btn btn-g" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-p" onclick="(async()=>{
        await api('PUT','/menu/produtos/${id}',{
          nome:document.getElementById('ep-n').value.trim(),
          preco:+document.getElementById('ep-p').value
        });
        closeModal();toast('Atualizado!','s');renderCardapio();
      })()">Salvar</button>`);
  };
}
